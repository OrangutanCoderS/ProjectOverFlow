[workspace]
members = [
    "crates/config",
    "crates/core",
    "crates/crash",
    "crates/daemon",
    "crates/filemon",
    "crates/ipc",
    "crates/logs",
    "crates/netmon",
    "crates/plugins",
    "crates/process",
    "crates/sensors",
    "crates/system",
    "crates/utils",
    "crates/clipboard",
    "crates/sensorlog",
    "crates/crashdet",
    "crates/cloudsync",
    "crates/periphmon",
    "crates/securemode",
    "crates/sandbox",
    "crates/plugin_engine",
    "crates/plugin_api",
    "crates/plugin_loader", 
    "crates/export_tools",
    "crates/telemetry_bridge",
    "crates/watchdog", 
    "crates/behavior_injector", "crates/os_shim",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# error handling
anyhow = "1"
thiserror = "1"

# logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# concurrency & sync
parking_lot = "0.12"
once_cell = "1"

# benchmarking & signal handling
criterion = "0.5"
ctrlc = "3"

# time handling
chrono = { version = "0.4", features = ["serde"] }

# dynamic loading / FFI
libloading = "0.8"
libc = "0.2"
