[workspace]
members = [
    "crates/config",
    "crates/core",
    "crates/crash",
    "crates/daemon",
    "crates/filemon",
    "crates/ipc",
    "crates/logs",
    "crates/netmon",
    "crates/plugins",
    "crates/process",
    "crates/sensors",
    "crates/system",
    "crates/utils",
    "crates/clipboard",
    "crates/sensorlog",
    "crates/crashdet",
     "crates/cloudsync",
     "crates/periphmon",
      "crates/securemode",
       "crates/sandbox",
]
resolver = "2"
[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
parking_lot = "0.12"
once_cell = "1"
criterion = "0.5"
ctrlc = "3"
