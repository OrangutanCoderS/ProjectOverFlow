[package]
name = "graph_merger"
version = "0.1.0"
edition = "2021"

[lib]
name = "graph_merger"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "merge_bench"
harness = false