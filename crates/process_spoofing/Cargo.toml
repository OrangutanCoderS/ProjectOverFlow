[package]
name = "process_spoofing"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
libc = "0.2"
once_cell = "1.19"
log = "0.4"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"

[features]
default = []
macos = []
linux = []