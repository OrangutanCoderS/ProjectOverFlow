[package]
name = "export_sanitizer"
version = "0.1.0"
edition = "2021"

[lib]
name = "export_sanitizer"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tracing = "0.1"
regex = "1"
sha2 = "0.10"
rand = "0.8"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "sanitizer_bench"
harness = false
