[package]
name = "plugin_response_chain"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"           # reserved; not used yet but consistent with others
thiserror = "1.0"
hashbrown = { version = "0.15", features = ["serde"] }

[dev-dependencies]
criterion = "0.5"

[lib]
name = "plugin_response_chain"
path = "src/lib.rs"

[[bench]]
name = "plugin_response_chain_bench"
harness = false