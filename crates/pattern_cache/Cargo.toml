[package]
name = "pattern_cache"
version = "0.1.0"
edition = "2021"

[lib]
name = "pattern_cache"
path = "src/lib.rs"

[dependencies]
# SQLite backend (unified across workspace)
rusqlite = { workspace = true }
libsqlite3-sys = { workspace = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
thiserror = "1"

# Concurrency
parking_lot = "0.12"

# Time
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "cache_bench"
harness = false