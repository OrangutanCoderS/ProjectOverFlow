[package]
name = "policy_audit_log"
version = "0.1.0"
edition = "2021"

[lib]
name = "policy_audit_log"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "1"
parking_lot = "0.12"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "audit_bench"
harness = false
