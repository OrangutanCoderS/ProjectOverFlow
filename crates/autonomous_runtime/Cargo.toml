[package]
name = "autonomous_runtime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "autonomous_runtime"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[dev-dependencies]
criterion = "0.5"
serde_json = "1"

[[bench]]
name = "runtime_loop_bench"
harness = false