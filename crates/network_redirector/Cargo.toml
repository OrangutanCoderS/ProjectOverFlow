[package]
name = "network_redirector"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }      
thiserror = "1.0"
parking_lot = "0.12"
once_cell = "1.21"
log = "0.4"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"

[features]
default = ["mock"]
mock = []
pfctl = []
iptables = []

[[bench]]
name = "net_redirect_bench"
harness = false