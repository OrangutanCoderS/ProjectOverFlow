[package]
name = "telemetry_pattern_miner"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rusqlite = { workspace = true }
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"