[package]
name = "cloudsync"
version = "0.1.0"
edition = "2021"

[lib]
name = "cloudsync"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
once_cell = "1.19"
thiserror = "1.0"

overflow-utils = { path = "../utils", package = "overflow-utils" }

[dev-dependencies]
pretty_assertions = "1.4"
criterion = "0.5"

[[bench]]
name = "cloudsync_bench"
harness = false
