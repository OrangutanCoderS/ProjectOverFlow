[package]
name = "socket_listener"
version = "0.1.0"
edition = "2021"

[lib]
name = "socket_listener"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "rt-multi-thread"] }
tokio-rustls = "0.26"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
parking_lot = "0.12"
lru = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion = "0.5"

[dependencies.async-trait]
version = "0.1"

[[bench]]
name = "listener_bench"
harness = false