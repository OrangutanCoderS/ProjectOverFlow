[package]
name = "clipboard"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "clipboard"
path = "src/lib.rs"

[features]
# placeholder for future bridge to core AnyEvent
with-core = []

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
signal-hook = "0.3"
sha2 = "0.10"

# Use your hardened helpers (timeouts, UTC timestamps)
overflow-utils = { path = "../utils" }

[dev-dependencies]
criterion = "0.5"
pretty_assertions = "1.4"
tempfile = "3"

[[bench]]
name = "clipboard_benches"
harness = false
