[package]
name = "crashdet"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "crashdet"
path = "src/lib.rs"

[features]
with-core = []

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
once_cell = "1.19"

# time/utc only used via your utils; chrono optional if you want local parsing later
overflow-utils = { path = "../utils" }

[dev-dependencies]
pretty_assertions = "1.4"
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "crashdet_bench"
harness = false
