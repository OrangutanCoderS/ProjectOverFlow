[package]
name = "daemon"
version = "0.1.0"
edition = "2021"

[lib]
name = "daemon"
path = "src/lib.rs"

[[bin]]
name = "overflowd"
path = "src/main.rs"

[dependencies]
# Error handling & Logging
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Concurrency & Signals
parking_lot = "0.12"
once_cell = "1"
ctrlc = "3"

# Data & Time
serde_json = "1"
chrono = "0.4"

# --- Workspace Dependencies (The "Brain" & "Config") ---
config = { path = "../config" }
autonomous_runtime = { path = "../autonomous_runtime" }

# --- Action Crates (The "Hands") ---
action_kill = { path = "../action_kill" }
action_suspend = { path = "../action_suspend" }
action_throttle = { path = "../action_throttle" }

# --- Monitor Crates (The "Eyes") ---
system = { path = "../system" }
netmon = { path = "../netmon" }

# Filemon is macOS-only usually, but we include it generally here; 
# conditional compilation in code handles the rest.
filemon = { path = "../filemon" }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[features]
default = ["noop"]
noop = []