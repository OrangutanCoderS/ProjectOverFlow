[package]
name = "execution_node"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"

[lib]
name = "execution_node"
path = "src/lib.rs"

[[bench]]
name = "execution_node_bench"
harness = false
