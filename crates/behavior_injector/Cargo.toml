[package]
name = "behavior_injector"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Phase II intervention dispatcher for OverFlow — safe, logged, rule-driven execution engine."

[features]
default = ["logs-integration"]
# Optional integrations (compile-time, no breakage if absent):
logs-integration = []            # integrate with OverFlow logs crate via trait adapter (no hard dep by default)
sandbox-integration = []         # integrate with OverFlow sandbox crate via trait adapter
process-integration = []         # integrate with OverFlow process crate (PID existence, self-protect, etc.)
c-shim = ["libloading"]          # optional loading of C augmentation shims (dlopen) without linking

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3", features = ["formatting"] }
parking_lot = "0.12"
once_cell = "1.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
anyhow = "1"
libc = "0.2"
cfg-if = "1"
# Optional runtime FFI loading (only when feature c-shim is set)
libloading = { version = "0.8", optional = true }
os_shim = { path = "../os_shim" }


[dev-dependencies]
criterion = "0.5"
tempfile = "3"
assert_matches = "1.5"

[[bench]]
name = "behavior_injector_bench"
harness = false
