[package]
name = "action_kill"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
parking_lot = "0.12"
nix = { version = "0.28", features = ["signal", "process", "resource"] }
sha2 = "0.10"
walkdir = "2.5"
log = "0.4"
anyhow = "1.0"
criterion = { version = "0.5", optional = true }
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []
bench = ["criterion"]
criterion = ["dep:criterion"]

[[bench]]
name = "action_bench"
harness = false
