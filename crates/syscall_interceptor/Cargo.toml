[package]
name = "syscall_interceptor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
crossbeam-channel = "0.5"   # for async-ish event stream
once_cell = "1.21"
chrono.workspace = true

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"
