[package]
name = "auth_layer"
version = "0.1.0"
edition = "2021"

[lib]
name = "auth_layer"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
parking_lot = "0.12"
lru = "0.12"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.21"

[dev-dependencies]
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "auth_bench"
harness = false
