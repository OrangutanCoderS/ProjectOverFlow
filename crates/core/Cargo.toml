[package]
name = "overflow-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "overflow_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
bitflags = { version = "2", features = ["serde"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"