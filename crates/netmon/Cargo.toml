[package]
name = "netmon"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "netmon"
path = "src/lib.rs"

[features]
with-core = []

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"

# Correct: package name is overflow-utils, lib name is overflow_utils
overflow-utils = { path = "../utils" }

[dev-dependencies]
criterion = "0.5"
pretty_assertions = "1.4"

[[bench]]
name = "netmon_parse_bench"
harness = false