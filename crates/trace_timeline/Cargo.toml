[package]
name = "trace_timeline"
version = "0.1.0"
edition = "2021"

[lib]
name = "trace_timeline"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "trace_window_bench"
harness = false