[package]
name = "plugin_engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
libloading = "0.8"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
libc = "0.2" 

[dev-dependencies]
criterion = "0.5"
pretty_assertions = "1.4"

[lib]
name = "plugin_engine"
path = "src/lib.rs"

[[bench]]
name = "plugin_engine_bench"
harness = false