[package]
name = "peer_sync"
version = "0.1.0"
edition = "2021"

[lib]
name = "peer_sync"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["net", "time", "rt-multi-thread", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
parking_lot = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "sync_bench"
harness = false