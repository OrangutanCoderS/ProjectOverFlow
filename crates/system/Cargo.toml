[package]
name = "system"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.30", default-features = false, features = ["multithread"] }

overflow-core = { path = "../core" }
overflow-utils = { path = "../utils" }

tracing = "0.1"
regex = "1"

[dev-dependencies]
serial_test = "2"
criterion = "0.5"

[features]
default = []
core-integration = []

# 🔥 IMPORTANT: Declare the main binary (system)
[[bin]]
name = "system"
path = "src/main.rs"