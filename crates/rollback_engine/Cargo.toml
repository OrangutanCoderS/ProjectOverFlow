[package]
name = "rollback_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "rollback_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "rollback_bench"
harness = false