[package]
name = "policy_diff_viewer"
version = "0.1.0"
edition = "2021"

[lib]
name = "policy_diff_viewer"
path = "src/lib.rs"

[[bin]]
name = "policy_diff_viewer_cli"
path = "src/cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
similar = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "diff_bench"
harness = false