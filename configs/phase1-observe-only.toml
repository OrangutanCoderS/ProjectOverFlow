[meta]
schema_version = 1
phase = "phase1"

[logging]
level = "info"
stdout = true
rotate_after_mb = 10
max_days = 7

[scheduler]
tick_ms = 100
watchdog_ms = 500

[ipc]
bind = "/tmp/overflow.sock"
auth_token = "change_me_please123"

[plugins]
auto_load = true
directories = ["plugins"]
secure_mode_threshold = 7.5
max_concurrent = 2

[telemetry]
enabled = true
compress = true

[paths]
log_dir = "logs"
export_dir = "logs/snapshots"

[toggles]
dns_logging = false
entropy_flagger = false
clipboard_events = false